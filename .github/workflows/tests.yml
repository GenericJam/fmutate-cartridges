# The pipeline's own logic under pytest (tests/): the index as strict JSON, releases split and checked, the plan, pins,
# the signatures (with a throwaway key) and the parity gate. No builds, no network, no secrets, no write token; apart
# from the cartridges workflow, so it never stands in the way of a publish.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -q --require-hashes -r pipeline/requirements.txt -r pipeline/requirements-dev.txt
      - run: python3 -m pytest -q -p no:cacheprovider tests
