# Re-runs the failed jobs of a cartridges run, up to twice. A firmware that doesn't build doesn't fail its job (the
# outcome goes to the index's "tried" list), so a failed job is the infrastructure's: a lost or timed-out runner
# (macOS ones mostly), a download that kept failing, GitHub's rate limits outlasting the publish job's wait. The
# re-run's publish job adds what it builds to the index and to the run's release.
name: retry

on:
  workflow_run:
    workflows: [cartridges]
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { actions: write }
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          sleep 60
          gh run rerun "$RUN_ID" --failed -R "$GITHUB_REPOSITORY"
