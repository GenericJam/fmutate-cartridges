# Builds FM-1 Firmware Hub firmwares as FMutate native cartridges, checks each against the same firmware's Hub package
# in FMutate's emulator engine, and publishes the ones that match as signed release assets plus a signed index at
# https://genericjam.github.io/fmutate-cartridges/index.json (gh-pages). One firmware per job: each job runs that
# firmware's own build scripts, so no job holds a write token or the signing key, and publish.py takes only a job's
# own firmware from its artifact. The daily run builds what the Hub changed since the published index.
name: cartridges

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Firmware ids to build (space-separated); empty = new or changed on the Hub"
        required: false
        default: ""
      all:
        description: "Rebuild every firmware"
        type: boolean
        default: false
  schedule:
    - cron: "23 5 * * *"

permissions: {}

concurrency:
  group: cartridges
  cancel-in-progress: false

env:
  FM1_CATALOG_DIR: ${{ github.workspace }}/work
  FM1_ENGINE_DIR: ${{ github.workspace }}/engine
  NDK_VERSION: r27c
  RUST_VERSION: "1.99.1"
  PAGES_URL: https://genericjam.github.io/fmutate-cartridges

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: { contents: read }
    outputs:
      ids: ${{ steps.plan.outputs.ids }}
      any: ${{ steps.plan.outputs.any }}
      hub_updated: ${{ steps.plan.outputs.hub_updated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Published index (gh-pages)
        run: |
          mkdir -p prev
          if git fetch -q --depth 1 origin gh-pages; then
            git show FETCH_HEAD:index.json > prev/index.json
            git show FETCH_HEAD:index.json.sig > prev/index.json.sig
          else
            echo "no gh-pages yet: the first run"
          fi
      - name: Pins from the Hub's catalogue
        run: |
          for _ in 1 2 3; do curl -fsSL -A fmutate-cartridges -o catalog.json https://thefirmwarehub.com/catalog.json && break; sleep 15; done
          python3 pipeline/pins.py catalog.json
          python3 pipeline/deps.py --check
      - id: plan
        env:
          IDS: ${{ inputs.ids }}
          ALL: ${{ inputs.all }}
        run: |
          set -f
          if [ "$ALL" = "true" ]; then ids=$(python3 pipeline/plan.py --all)
          else ids=$(python3 pipeline/plan.py --index prev/index.json $IDS); fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          [ "$ids" = "[]" ] && echo "any=false" >> "$GITHUB_OUTPUT" || echo "any=true" >> "$GITHUB_OUTPUT"
          echo "hub_updated=$(python3 -c 'import json; print(json.load(open("catalog.json"))["updated"])')" >> "$GITHUB_OUTPUT"
          echo "building: $ids" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: pins, path: pipeline/pins.json }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: prev, path: prev/, if-no-files-found: ignore }

  engine:
    # FMutate's two engines (its native one, which loads a cartridge, and its emulator one), for the parity check
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11
        with: { toolchain: "${{ env.RUST_VERSION }}" }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fmutate/native/build/emu-target
          key: emu-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('pipeline/engine.sh') }}
      - run: sh pipeline/engine.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: engine, path: engine }

  android:
    # this computer's build + the parity check + the three Android ABIs, one firmware per job
    name: android (${{ matrix.id }})
    needs: [plan, engine]
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: { contents: read }
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    env:
      ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: pins, path: pipeline }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: engine, path: engine }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Tools
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q clang lld libfribidi0 >/dev/null
          pip install -q --require-hashes -r pipeline/requirements.txt
          chmod +x engine/*
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: ndk
        with: { ndk-version: "${{ env.NDK_VERSION }}", add-to-path: false }
      - name: Fetch
        run: for _ in 1 2 3; do sh pipeline/fetch.sh "$ID" | tee fetch.log; grep -q "FETCH FAILED" fetch.log || break; sleep 20; done
      - name: Build (this computer) and check against the emulator
        run: |
          python3 pipeline/build.py "$ID" --target host || true
          [ -f "work/out/host/libcart_$ID.so" ] && python3 pipeline/verify.py "$ID" || true
      - name: Build (Android)
        env: { ANDROID_NDK_HOME: "${{ steps.ndk.outputs.ndk-path }}" }
        run: |
          for t in android-arm64-v8a android-x86_64 android-armeabi-v7a; do python3 pipeline/build.py "$ID" --target $t || true; done
      - name: Summary
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "pipeline")
          from report import verdict
          fid, w = os.environ["ID"], Path("work")
          res = {t: json.loads(p.read_text()) for p in w.glob(f"results/{fid}.*.json") for t in [p.name[len(fid) + 1:-5]]}
          v = w / "verify" / f"{fid}.json"
          rec = ((res.get("host") or {}).get("recipe") or {}).get("recipe")
          check = verdict(json.loads(v.read_text()), rec) if v.exists() else ("unchecked", [])
          print(f"{fid}: {check[0]} {'; '.join(check[1])[:200]} | " + ", ".join(
              f"{t} {'ok' if r.get('ok') else 'failed at ' + str(r.get('stage'))}" for t, r in sorted(res.items())))
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cart-android-${{ matrix.id }}
          path: |
            work/results/${{ matrix.id }}.*
            work/verify/${{ matrix.id }}.*
            work/out/*/libcart_${{ matrix.id }}.so
          if-no-files-found: ignore

  gate:
    # the parity gate: iOS builds only what passed the check
    needs: [plan, android]
    if: always() && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    outputs:
      ids: ${{ steps.gate.outputs.ids }}
      any: ${{ steps.gate.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: pins, path: pipeline }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "cart-android-*", path: artifacts }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - id: gate
        run: |
          mkdir -p artifacts
          ids=$(python3 pipeline/gate.py --artifacts artifacts 2>gate.txt)
          { echo '```'; cat gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          [ "$ids" = "[]" ] && echo "any=false" >> "$GITHUB_OUTPUT" || echo "any=true" >> "$GITHUB_OUTPUT"

  ios:
    # static libraries for the iOS app build, only for what passed the gate. macOS runners are few (5 at a time on
    # the free plan) and can queue for a while: queued jobs just wait; a lost runner is retried by retry.yml.
    name: ios (${{ matrix.id }})
    needs: [gate]
    if: always() && needs.gate.outputs.any == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    permissions: { contents: read }
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        id: ${{ fromJson(needs.gate.outputs.ids) }}
    env:
      ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: pins, path: pipeline }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -q --require-hashes -r pipeline/requirements.txt
      - name: Fetch
        run: for _ in 1 2 3; do sh pipeline/fetch.sh "$ID" | tee fetch.log; grep -q "FETCH FAILED" fetch.log || break; sleep 20; done
      - name: Build (iOS device, simulator)
        run: for t in ios-device ios-sim; do python3 pipeline/build.py "$ID" --target $t || true; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cart-ios-${{ matrix.id }}
          path: |
            work/results/${{ matrix.id }}.ios-*
            work/out/ios-*/libcart_${{ matrix.id }}.a
          if-no-files-found: ignore

  publish:
    needs: [plan, engine, android, gate, ios]
    if: always() && needs.plan.outputs.any == 'true' && needs.engine.result == 'success' && needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: pins, path: pipeline }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "cart-*", path: artifacts }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Pages branch
        run: |
          if git fetch -q origin gh-pages; then git worktree add -q pages FETCH_HEAD; else git worktree add -q --orphan -b gh-pages pages; fi
      - name: Index, signed
        env:
          SIGNING_KEY: ${{ secrets.CARTRIDGE_SIGNING_KEY }}
          HUB_UPDATED: ${{ needs.plan.outputs.hub_updated }}
        run: |
          mkdir -p artifacts
          tag="build-$(date -u +%Y%m%d)-${{ github.run_number }}.${{ github.run_attempt }}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          if [ -f pages/index.json ]; then prev="--prev pages/index.json"; else prev="--first"; fi
          umask 077
          key=$(mktemp)
          printf '%s\n' "$SIGNING_KEY" > "$key"
          python3 pipeline/publish.py --artifacts artifacts --tag "$tag" --out dist --key "$key" $prev \
            --hub-updated "$HUB_UPDATED" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f "$key"
          python3 - <<'EOF'
          # the index must verify against the public key FMutate ships before anything is published
          import base64, subprocess, tempfile, sys
          sig = base64.b64decode(open("dist/index.json.sig").read())
          with tempfile.NamedTemporaryFile() as s:
              s.write(sig); s.flush()
              sys.exit(subprocess.run(["openssl", "pkeyutl", "-verify", "-pubin", "-inkey", "pipeline/signing.pub.pem",
                                       "-rawin", "-in", "dist/index.json", "-sigfile", s.name]).returncode)
          EOF
      - name: Release assets
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if ls dist/assets/libcart_* >/dev/null 2>&1; then
            cp pipeline/pins.json dist/assets/pins.json
            for _ in 1 2 3; do
              gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" \
                --notes "Cartridges built by run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Each is built from the firmware's pinned public source commit (pins.json here; the index names repo and commit per firmware); GPL source offer: README." && \
              gh release upload "$TAG" dist/assets/* --clobber && break
              sleep 30
            done
            gh release view "$TAG" >/dev/null
          fi
      - name: Index to GitHub Pages (gh-pages)
        run: |
          cp dist/index.json dist/index.json.sig pages/
          touch pages/.nojekyll
          cd pages
          git add index.json index.json.sig .nojekyll
          git -c user.name=fmutate-cartridges -c user.email=actions@github.com commit -q -m "index: run ${{ github.run_number }}.${{ github.run_attempt }}" || exit 0
          git push origin HEAD:gh-pages
