# Builds FM-1 Firmware Hub firmwares as FMutate native cartridges, checks each against the same firmware's Hub package
# in FMutate's emulator engine, and publishes the ones that match as signed release assets plus a signed index at
# https://genericjam.github.io/fmutate-cartridges/index.json (gh-pages). One firmware per job: each job runs that
# firmware's own build scripts, so no job holds a write token or the signing key, and publish.py takes only a job's
# own firmware from its artifact. The daily run builds what the Hub changed since the published index.
name: cartridges

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Firmware ids to build (space-separated); empty = new or changed on the Hub"
        required: false
        default: ""
      all:
        description: "Rebuild every firmware"
        type: boolean
        default: false
      reindex:
        description: "Build nothing: re-sign and republish the published index as publish.py writes it now"
        type: boolean
        default: false
  schedule:
    - cron: "23 5 * * *"

permissions: {}

concurrency:
  group: cartridges
  cancel-in-progress: false

env:
  FM1_CATALOG_DIR: ${{ github.workspace }}/work
  FM1_ENGINE_DIR: ${{ github.workspace }}/engine
  NDK_VERSION: r27c
  RUST_VERSION: "1.99.1"
  PAGES_URL: https://genericjam.github.io/fmutate-cartridges

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: { contents: read }
    outputs:
      ids: ${{ steps.plan.outputs.ids }}
      chunks: ${{ steps.plan.outputs.chunks }}
      any: ${{ steps.plan.outputs.any }}
      hub_updated: ${{ steps.plan.outputs.hub_updated }}
      date: ${{ steps.plan.outputs.date }}
      reindex: ${{ steps.plan.outputs.reindex }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Published index (gh-pages)
        # (a missing branch means the first run; a failed fetch must fail, not plan everything as new. The index keeps
        # pins for unchanged versions, so it must verify as publish.py's --prev does.)
        run: |
          mkdir -p prev
          rc=0; git ls-remote --exit-code --heads origin gh-pages >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git fetch -q --depth 1 origin gh-pages
            git show FETCH_HEAD:index.json > prev/index.json
            git show FETCH_HEAD:index.json.sig > prev/index.json.sig
            base64 -d prev/index.json.sig > "$RUNNER_TEMP/index.sig.bin"
            openssl pkeyutl -verify -pubin -inkey pipeline/signing.pub.pem -rawin -in prev/index.json \
              -sigfile "$RUNNER_TEMP/index.sig.bin"
          elif [ "$rc" = 2 ]; then
            echo "no gh-pages yet: the first run"
          else
            echo "gh-pages: git ls-remote failed ($rc)" >&2; exit 1
          fi
      - name: Pins from the Hub's catalogue
        run: |
          for _ in 1 2 3; do curl -fsSL -A fmutate-cartridges -o catalog.json https://thefirmwarehub.com/catalog.json && break; sleep 15; done
          python3 pipeline/pins.py catalog.json --index prev/index.json
          python3 pipeline/deps.py --check
      - id: plan
        env:
          IDS: ${{ inputs.ids }}
          ALL: ${{ inputs.all }}
          REINDEX: ${{ inputs.reindex }}
        run: |
          set -f
          if [ "$REINDEX" = "true" ]; then ids="[]"
          elif [ "$ALL" = "true" ]; then ids=$(python3 pipeline/plan.py --all)
          else ids=$(python3 pipeline/plan.py --index prev/index.json $IDS); fi
          echo "reindex=${REINDEX:-false}" >> "$GITHUB_OUTPUT"
          chunks=$(python3 -c 'import json, sys; ids = json.loads(sys.argv[1]); n = 150; print(json.dumps([{"n": i // n + 1, "ids": json.dumps(ids[i:i+n])} for i in range(0, len(ids), n)]))' "$ids")
          count=$(python3 -c 'import json, sys; print(len(json.loads(sys.argv[1])))' "$ids")
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "chunks=$chunks" >> "$GITHUB_OUTPUT"
          [ "$ids" = "[]" ] && echo "any=false" >> "$GITHUB_OUTPUT" || echo "any=true" >> "$GITHUB_OUTPUT"
          echo "hub_updated=$(python3 -c 'import json; print(json.load(open("catalog.json"))["updated"])')" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "building ($count): $ids" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: pins, path: pipeline/pins.json }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: prev, path: prev/, if-no-files-found: ignore }

  engine:
    # FMutate's two engines (its native one, which loads a cartridge, and its emulator one), for the parity check
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11
        with: { toolchain: "${{ env.RUST_VERSION }}" }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fmutate/native/build/emu-target
          key: emu-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('pipeline/engine.sh') }}
      - run: sh pipeline/engine.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: engine, path: engine }

  android:
    # this computer's build + the parity check + the three Android ABIs, one firmware per job (chunked <=150 for the 256-job matrix cap)
    name: android batch ${{ matrix.chunk.n }}
    needs: [plan, engine]
    if: needs.plan.outputs.any == 'true'
    permissions: { contents: read }
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    uses: ./.github/workflows/_build-android.yml
    with:
      ids: ${{ matrix.chunk.ids }}

  gate:
    # the parity gate: iOS builds only what passed the check
    needs: [plan, engine, android]
    if: always() && needs.plan.outputs.any == 'true' && needs.engine.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    outputs:
      ids: ${{ steps.gate.outputs.ids }}
      chunks: ${{ steps.gate.outputs.chunks }}
      any: ${{ steps.gate.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: pins, path: pipeline }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "cart-android-*", path: artifacts }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - id: gate
        run: |
          mkdir -p artifacts
          if ! compgen -G "artifacts/cart-android-*" >/dev/null; then
            echo "gate: no cart-android-* artifacts found despite planned builds" >&2
            exit 1
          fi
          ids=$(python3 pipeline/gate.py --artifacts artifacts 2>gate.txt)
          chunks=$(python3 -c 'import json, sys; ids = json.loads(sys.argv[1]); n = 150; print(json.dumps([{"n": i // n + 1, "ids": json.dumps(ids[i:i+n])} for i in range(0, len(ids), n)]))' "$ids")
          { echo '```'; cat gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "chunks=$chunks" >> "$GITHUB_OUTPUT"
          [ "$ids" = "[]" ] && echo "any=false" >> "$GITHUB_OUTPUT" || echo "any=true" >> "$GITHUB_OUTPUT"

  ios:
    # static libraries for the iOS app build, only for what passed the gate. macOS runners are few (5 at a time on
    # the free plan) and can queue for a while: queued jobs just wait; a lost runner is retried by retry.yml.
    name: ios batch ${{ matrix.chunk.n }}
    needs: [gate]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.any == 'true'
    permissions: { contents: read }
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chunk: ${{ fromJson(needs.gate.outputs.chunks) }}
    uses: ./.github/workflows/_build-ios.yml
    with:
      ids: ${{ matrix.chunk.ids }}

  publish:
    needs: [plan, engine, android, gate, ios]
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.reindex == 'true' || (needs.plan.outputs.any == 'true' && needs.engine.result == 'success' && needs.gate.result == 'success' && needs.ios.result != 'cancelled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: pins, path: pipeline }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.reindex != 'true'
        with: { pattern: "cart-*", path: artifacts }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Pages branch
        # only a branch that doesn't exist starts a new index (--first); a failed fetch fails the job
        run: |
          rc=0; git ls-remote --exit-code --heads origin gh-pages >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then git fetch -q origin gh-pages; git worktree add -q pages FETCH_HEAD
          elif [ "$rc" = 2 ]; then git worktree add -q --orphan -b gh-pages pages
          else echo "gh-pages: git ls-remote failed ($rc)" >&2; exit 1; fi
      - name: Index, signed
        env:
          SIGNING_KEY: ${{ secrets.CARTRIDGE_SIGNING_KEY }}
          HUB_UPDATED: ${{ needs.plan.outputs.hub_updated }}
          REINDEX: ${{ needs.plan.outputs.reindex }}
          # (one tag per run, its re-runs too: release.py adds only what a release lacks, under names per content)
          TAG: build-${{ needs.plan.outputs.date }}-${{ github.run_number }}
        run: |
          mkdir -p artifacts
          if [ -f pages/index.json ]; then prev="--prev pages/index.json"; else prev="--first"; fi
          [ "$REINDEX" = "true" ] && prev="$prev --reindex"
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          python3 pipeline/publish.py --artifacts artifacts --tag "$TAG" --out dist --key "$key" $prev \
            --hub-updated "$HUB_UPDATED" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f "$key"
          python3 - <<'EOF'
          # the index must verify against the public key FMutate ships before anything is published
          import base64, subprocess, tempfile, sys
          sig = base64.b64decode(open("dist/index.json.sig").read())
          with tempfile.NamedTemporaryFile() as s:
              s.write(sig); s.flush()
              sys.exit(subprocess.run(["openssl", "pkeyutl", "-verify", "-pubin", "-inkey", "pipeline/signing.pub.pem",
                                       "-rawin", "-in", "dist/index.json", "-sigfile", s.name]).returncode)
          EOF
      - name: Release assets
        # every asset the index names must be in its release before the index goes out (release.py waits out the
        # token's rate limit, so a run that rebuilds everything may take most of an hour here)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: "Cartridges built by run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Each is built from the firmware's pinned public source commit (pins.json here; the index names repo and commit per firmware, and each cartridge's signature); GPL source offer: README."
        run: |
          python3 pipeline/release.py --assets dist/assets --index dist/index.json --repo "$GITHUB_REPOSITORY" \
            --extra pipeline/pins.json --notes "$NOTES"
      - name: Index to GitHub Pages (gh-pages)
        run: |
          cp dist/index.json dist/index.json.sig pages/
          touch pages/.nojekyll
          cd pages
          git add index.json index.json.sig .nojekyll
          if git diff --cached --quiet; then echo "index unchanged"; exit 0; fi
          git -c user.name=fmutate-cartridges -c user.email=actions@github.com commit -q -m "index: run ${{ github.run_number }}.${{ github.run_attempt }}"
          git push origin HEAD:gh-pages
